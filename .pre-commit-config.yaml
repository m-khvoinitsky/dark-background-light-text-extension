repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --list-different --ignore-unknown
        language: system
        pass_filenames: true
        types: [text]
        args: []
        require_serial: false
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        pass_filenames: true
        types_or: [ts, javascript, svelte]
        args: []
        require_serial: false
  - repo: local
    hooks:
      - id: tests
        name: Mocha tests
        language: system
        entry: npm test
        always_run: true
        pass_filenames: false
        require_serial: true
  - repo: local
    hooks:
      - id: coverage
        name: Ensure that coverage hasn't decreased per-file
        language: system
        entry: ./check-coverage last-coverage-summary.json
        always_run: true
        pass_filenames: false
        require_serial: true
  - repo: local
    hooks:
      - id: svelte-check
        name: Svelte check
        language: system
        entry: npx svelte-check --fail-on-warnings
        always_run: true
        pass_filenames: false
        require_serial: true
  - repo: local
    hooks:
      - id: build
        name: Build and lint the packaged add-on
        language: system
        entry: sh -c 'ADDON_BUILD_OUT="$(mktemp -d)"; export ADDON_BUILD_OUT; npm run build; EXITCODE=$?; rm -r "${ADDON_BUILD_OUT}"; exit "${EXITCODE}"'
        always_run: true
        pass_filenames: false
        require_serial: true
